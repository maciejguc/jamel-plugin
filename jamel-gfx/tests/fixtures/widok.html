<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pracownia Lipowa - strona główna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FBF7F2; --text: #2B2420; --accent: #C2410C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; line-height: 1.5; }
  .hero { display: flex; gap: 48px; align-items: center; max-width: 1200px; margin: 0 auto; padding: 64px 32px; }
  .hero__tekst { flex: 1; }
  h1 { font-family: 'Fraunces', serif; font-weight: 800; font-size: 56px; line-height: 1.1; margin: 0 0 16px; }
  p { font-size: 18px; margin: 0 0 24px; }
  .przycisk { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 14px 28px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 200ms ease-in-out; }
  .przycisk:hover { background: #9A3412; }
  .hero__zdjecie { flex: 1; display: grid; gap: 16px; }
  .hero__zdjecie img { width: 100%; height: 220px; object-fit: cover; border-radius: 12px; }
  .plakietka { display: inline-block; background: #fff; border: 1px solid var(--text); border-radius: 999px; padding: 4px 16px; font-size: 14px; margin-bottom: 16px; animation: puls 2s ease-in-out infinite alternate; }
  @keyframes puls { from { opacity: 0.6; } to { opacity: 1; } }
  @media (max-width: 768px) {
    .hero { flex-direction: column; padding: 32px 16px; }
    h1 { font-size: 36px; }
  }
</style>
</head>
<body>
  <main class="hero">
    <div class="hero__tekst">
      <span class="plakietka">Nowa kolekcja</span>
      <h1>Meble, które „mieszkają” z Tobą</h1>
      <p>Projektujemy i szyjemy na miarę. Umów bezpłatną wizytę w pracowni.</p>
      <button class="przycisk" type="button">Umów wizytę</button>
    </div>
    <div class="hero__zdjecie">
      <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800&q=70" alt="Filiżanka kawy na drewnianym stole">
      <img src="https://images.unsplash.com/photo-0000000000000-000000000000?w=800" alt="Wnętrze pracowni">
    </div>
  </main>
</body>
</html>
